services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: bookllm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bookllm
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bookllm
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: